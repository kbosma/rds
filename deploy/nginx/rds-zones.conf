# ============================================================================
#  RDS — rate-limit-zones voor rds.kbtg.nl.conf
# ============================================================================
#  Geplaatst als /etc/nginx/conf.d/rds-zones.conf; nginx.conf neemt
#  conf.d/*.conf op binnen het http{}-block (Debian/Ubuntu-standaard).
#  Eigen namen (rds_*), zodat ze niet botsen met zones van andere sites.
# ============================================================================

limit_req_zone $binary_remote_addr zone=rds_login:10m       rate=5r/m;
limit_req_zone $binary_remote_addr zone=rds_mollie:10m      rate=10r/s;
limit_req_zone $binary_remote_addr zone=rds_email_image:10m rate=20r/s;
