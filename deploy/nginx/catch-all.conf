# ============================================================================
#  Catch-all: wijs verzoeken voor onbekende hostnamen af
# ============================================================================
#  Door het wildcard-DNS-record (*.kbtg.nl) komt elke willekeurige naam
#  (test.kbtg.nl, xyz.kbtg.nl, ...) bij deze server uit, net als verzoeken
#  op het kale IP-adres. Zonder catch-all beantwoordt NGINX die met de eerste
#  de beste site. Deze server is de default_server en antwoordt niets.
#
#  ANDERE SUBDOMEINEN TOESTAAN: een server-blok met een eigen server_name
#  (bv. server_name app.kbtg.nl;) gaat altijd vóór de default_server. Een
#  nieuw subdomein toevoegen = alleen een eigen site-config + certificaat;
#  aan dit bestand hoeft niets te veranderen.
#
#  Geldt voor de HELE NGINX-server, niet alleen voor RDS. Er mag maar één
#  default_server per poort zijn; install.sh controleert dat vooraf.
#  Vereist NGINX >= 1.19.4 (ssl_reject_handshake).
#
#  Geplaatst als /etc/nginx/sites-available/00-catch-all (+ symlink).
# ============================================================================

server {
    listen 80      default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/blocked.log;
    return 444;   # verbinding dicht, geen antwoord
}

server {
    listen 443      ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # TLS-handshake weigeren: geen certificaat nodig en er lekt geen
    # certificaat (met de namen van je andere sites) naar onbekende clients.
    ssl_reject_handshake on;
}
