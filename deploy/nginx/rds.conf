# ============================================================================
#  RDS — NGINX site-config (sites-available/rds)
# ============================================================================
#  Versioneerde kopie van de serverconfig voor het RDS-systeem.
#  Toepassen op de server doe je zelf (kopieer naar /etc/nginx/sites-available,
#  symlink in sites-enabled, dan `sudo nginx -t && sudo systemctl reload nginx`).
#
#  Wijzigingen t.o.v. de vorige versie zijn gemarkeerd met  # FIX  of  # NIEUW.
#
#  LET OP — rate-limit-zones horen in het http{}-block (nginx.conf), NIET hier:
#      limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=5r/m;
#      limit_req_zone $binary_remote_addr zone=mollie_limit:10m rate=10r/s;
#  (pas de rates aan naar wens; bovenstaande zijn voorbeelden)
# ============================================================================


# ----------------------------------------------------------------------------
#  Server 1 — HTTPS, tevens default voor poort 443 (vangt ook IP-verkeer op 443)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name software.kbtg;

    ssl_certificate     /etc/nginx/ssl/software.kbtg.pem;
    ssl_certificate_key /etc/nginx/ssl/software.kbtg-key.pem;

    ##########################################################################
    ##  R D S   S Y S T E M
    ##########################################################################

    # =========================================================================
    #  NIEUW — Blokkeer bekende scan-/exploit-paden (444 = verbinding dicht,
    #  geen antwoord, request bereikt de backend NIET).
    #  Regex-locations winnen van de /api/-prefix, dus deze onderscheppen de
    #  scans ook al zou /api/ normaal matchen. Staat bewust bovenaan.
    #  Legitieme endpoints en static assets (.js/.css/.html/...) matchen niet.
    # =========================================================================

    # Dotfiles (.env, .git, .aws, ...) — behalve .well-known
    location ~* /\.(?!well-known) {
        access_log /var/log/nginx/blocked.log;   # of: access_log off;
        return 444;
    }

    # PHP-exploits, losse env-bestanden en bekende probe-endpoints
    location ~* (\.php($|[?/])|/vendor/|phpunit|eval-stdin|\.env($|[?/])|/(mcp|graphql|gql)($|[/?])) {
        access_log /var/log/nginx/blocked.log;   # of: access_log off;
        return 444;
    }

    # =========================
    #  RDS (employee) Frontend
    # =========================
    location /rds/ {
        root /var/www;
        try_files $uri $uri/ /rds/index.html;

        expires 7d;
        add_header Cache-Control "public";
    }

    # =========================
    #  BOOKER Frontend
    # =========================
    location /booker/ {
        root /var/www;
        try_files $uri $uri/ /booker/index.html;

        expires 7d;
        add_header Cache-Control "public";
    }

    # =========================
    #  Spring Boot API (algemeen)   /api/ -> /rds/api/
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:8666/rds/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JWT support
        proxy_set_header Authorization     $http_authorization;
    }

    # -----------------------
    #  Employee login (rate-limited)
    # -----------------------
    location /api/auth/login {
        limit_req zone=login_limit burst=2 nodelay;

        proxy_pass http://127.0.0.1:8666/rds/api/auth/login;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    #  Employee TOTP
    # -----------------------
    location /api/auth/login/totp {
        limit_req zone=login_limit burst=2 nodelay;

        # FIX — was bare proxy_pass (zonder /rds) -> 404. Nu met /rds.
        proxy_pass http://127.0.0.1:8666/rds/api/auth/login/totp;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    #  Employee recovery code
    # -----------------------
    location /api/auth/login/recovery {
        limit_req zone=login_limit burst=2 nodelay;

        # FIX — was bare proxy_pass (zonder /rds) -> 404. Nu met /rds.
        proxy_pass http://127.0.0.1:8666/rds/api/auth/login/recovery;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    #  Booker login (rate-limited)
    # -----------------------
    location /api/booker-auth/ {
        limit_req zone=login_limit burst=2 nodelay;

        proxy_pass http://127.0.0.1:8666/rds/api/booker-auth/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    #  JavaMelody monitoring
    # -----------------------
    location /monitoring {
        # NIEUW — JavaMelody toont gevoelige interne data (SQL, HTTP-stats,
        # systeem/geheugen). NIET publiek openzetten: beperk tot beheer-IP('s).
        allow 127.0.0.1;
        # allow <JOUW-BEHEER-IP>;      # TODO: vervang/voeg je eigen IP toe
        deny all;

        # FIX — was bare proxy_pass (zonder /rds). JavaMelody zit onder de
        # context-path, dus proxy naar /rds/monitoring.
        proxy_pass http://127.0.0.1:8666/rds/monitoring;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    #  Fallback
    # -----------------------
    location / {
        # FIX — was `return 200 "Server running"` (info-disclosure). Nu 404.
        return 404;
    }
}


# ----------------------------------------------------------------------------
#  Server 2 — HTTP -> HTTPS redirect
# ----------------------------------------------------------------------------
server {
    listen 80;
    server_name rds.kbtg;

    return 301 https://$host$request_uri;
}


# ----------------------------------------------------------------------------
#  Server 3 — HTTP op het publieke IP: alleen de Mollie-webhook, rest dicht
# ----------------------------------------------------------------------------
server {
    listen 80;
    server_name 178.104.163.88;

    # Alles dicht behalve de exacte webhook-location hieronder.
    location / {
        return 444;
    }

    ##
    #  Mollie Webhook — moet een EXACTE location zijn (= ...).
    ##
    location = /api/mollie/payments/webhook {
        limit_req zone=mollie_limit burst=20;

        proxy_pass http://127.0.0.1:8666/rds/api/mollie/payments/webhook;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
