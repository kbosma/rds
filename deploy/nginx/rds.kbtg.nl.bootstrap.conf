# ============================================================================
#  RDS — tijdelijke config om het EERSTE Let's Encrypt-certificaat op te halen
# ============================================================================
#  rds.kbtg.nl.conf verwijst naar certificaatbestanden die er de eerste keer
#  nog niet zijn (nginx -t faalt dan). Daarom zet deploy/scripts/deploy-nginx.sh
#  eerst deze config neer (alleen poort 80 + ACME-challenge), haalt het
#  certificaat op met certbot --webroot en vervangt hem daarna door de echte.
# ============================================================================

server {
    listen 80;
    listen [::]:80;      # Let's Encrypt valideert bij een AAAA-record eerst via IPv6
    server_name rds.kbtg.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
