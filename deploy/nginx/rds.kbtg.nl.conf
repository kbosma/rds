# ============================================================================
#  RDS — NGINX site-config voor rds.kbtg.nl (Let's Encrypt)
# ============================================================================
#  Geïsoleerde server voor het RDS-systeem; staat los van software.kbtg.
#  Wordt geplaatst door deploy/scripts/deploy-nginx.sh als
#  /etc/nginx/sites-available/rds.kbtg.nl (+ symlink in sites-enabled).
#
#  Vereisten (regelt het deploy-script):
#   - rds-zones.conf in /etc/nginx/conf.d/ (rate-limit-zones rds_*).
#   - Let's Encrypt-certificaat in /etc/letsencrypt/live/rds.kbtg.nl/
#     (eerste keer via rds.kbtg.nl.bootstrap.conf + certbot --webroot;
#     vernieuwen gaat automatisch via certbot.timer + reload van nginx).
#
#  Let op bij wijzigen:
#   - Proxy-headers en add_header staan op server-niveau en worden geërfd.
#     Een location die zelf een proxy_set_header of add_header zet, erft ze
#     NIET meer (dan alles in die location herhalen).
# ============================================================================


# ----------------------------------------------------------------------------
#  HTTPS
# ----------------------------------------------------------------------------
#  IPv4 én IPv6: DNS geeft ook een AAAA-record, en Let's Encrypt en veel
#  clients kiezen dan eerst IPv6. Zonder [::]-listen komt dat verkeer bij een
#  andere (default) server uit.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rds.kbtg.nl;

    ssl_certificate     /etc/letsencrypt/live/rds.kbtg.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rds.kbtg.nl/privkey.pem;

    access_log /var/log/nginx/rds.kbtg.nl.access.log;
    error_log  /var/log/nginx/rds.kbtg.nl.error.log;

    # Browser altijd via HTTPS (alleen dit subdomein; geen includeSubDomains).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gelden voor alle proxy_pass-locations hieronder (geërfd).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;   # JWT

    # =========================================================================
    #  Scan-/exploit-paden blokkeren (444 = verbinding dicht, bereikt de
    #  backend niet). Regex-locations winnen van prefix-locations zoals /api/.
    # =========================================================================

    # Dotfiles (.env, .git, .aws, ...) — behalve .well-known
    location ~* /\.(?!well-known) {
        access_log /var/log/nginx/blocked.log;
        return 444;
    }

    # PHP-exploits, losse env-bestanden en bekende probe-endpoints
    location ~* (\.php($|[?/])|/vendor/|phpunit|eval-stdin|\.env($|[?/])|/(mcp|graphql|gql)($|[/?])) {
        access_log /var/log/nginx/blocked.log;
        return 444;
    }

    # =========================
    #  Root -> employee-app
    # =========================
    location = / {
        return 302 /rds/;
    }

    # =========================
    #  RDS (employee) frontend
    #  Assets 7 dagen cachen (bestandsnamen bevatten een hash); index.html
    #  nooit, anders zien gebruikers een nieuwe build pas na 7 dagen.
    # =========================
    location /rds/ {
        root /var/www;
        try_files $uri $uri/ /rds/index.html;
        expires 7d;
    }

    location = /rds/index.html {
        root /var/www;
        expires -1;
    }

    # =========================
    #  Booker frontend
    # =========================
    location /booker/ {
        root /var/www;
        try_files $uri $uri/ /booker/index.html;
        expires 7d;
    }

    location = /booker/index.html {
        root /var/www;
        expires -1;
    }

    # =========================
    #  Vertalingen (beide frontends)
    #  i18n/nl.json en en.json hebben geen hash in de naam. Met 7 dagen cache
    #  zien gebruikers nieuwe teksten pas een week na een deploy (en tot dan
    #  sleutels als "roles.copyFrom"). Daarom altijd hervalideren (ETag/304).
    #  Regex-location gaat voor de prefix-locations /rds/ en /booker/.
    # =========================
    location ~ ^/(rds|booker)/i18n/[a-z]+\.json$ {
        root /var/www;
        expires -1;
    }

    # =========================
    #  Spring Boot API   /api/ -> /rds/api/
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:8666/rds/api/;
    }

    # -----------------------
    #  Employee login + TOTP + recovery (rate-limited)
    #  Prefix-match: dekt ook /api/auth/login/totp en /api/auth/login/recovery.
    # -----------------------
    location /api/auth/login {
        limit_req zone=rds_login burst=2 nodelay;

        proxy_pass http://127.0.0.1:8666/rds/api/auth/login;
    }

    # -----------------------
    #  Booker login / OTP (rate-limited)
    # -----------------------
    location /api/booker-auth/ {
        limit_req zone=rds_login burst=2 nodelay;

        proxy_pass http://127.0.0.1:8666/rds/api/booker-auth/;
    }

    # -----------------------
    #  Mollie-webhook (publiek, rate-limited). Mollie vereist een vertrouwd
    #  certificaat — dat is er met Let's Encrypt.
    #  Server-override:  app.mollie.urls.webhook=https://rds.kbtg.nl/api/mollie/payments/webhook
    # -----------------------
    location = /api/mollie/payments/webhook {
        limit_req zone=rds_mollie burst=20;

        proxy_pass http://127.0.0.1:8666/rds/api/mollie/payments/webhook;
    }

    # -----------------------
    #  E-mailafbeeldingen (publiek: ontvangers laden ze zonder login).
    #  Alleen exact /api/public/email-images/<uuid>, alleen GET/HEAD.
    #  Server-override:  app.email.public-api-base-url=https://rds.kbtg.nl/api
    #  Regex met {36} MOET tussen aanhalingstekens; een regex-location mag geen
    #  URI in proxy_pass hebben, vandaar rewrite + break.
    # -----------------------
    location ~ "^/api/public/email-images/[0-9a-fA-F-]{36}$" {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=rds_email_image burst=40 nodelay;

        rewrite ^/api/(.*)$ /rds/api/$1 break;
        proxy_pass http://127.0.0.1:8666;
    }

    # -----------------------
    #  JavaMelody monitoring — alleen beheer-IP's
    # -----------------------
    location /monitoring {
        allow 127.0.0.1;
        # allow <JOUW-BEHEER-IP>;
        deny all;

        proxy_pass http://127.0.0.1:8666/rds/monitoring;
    }

    # -----------------------
    #  Fallback
    # -----------------------
    location / {
        return 404;
    }
}


# ----------------------------------------------------------------------------
#  HTTP: ACME-challenge (Let's Encrypt-vernieuwing), verder -> HTTPS
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rds.kbtg.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
