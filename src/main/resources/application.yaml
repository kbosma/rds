server:
  port: 8666
  address: 127.0.0.1
#  address: 0.0.0.0

  shutdown: graceful
  max-http-request-header-size: 16KB

  servlet:
    context-path: /rds
    
  ssl:
    enabled: false
#    key-store: /Users/kees/Code/rds/rds-platform.p12
#    key-store-password: rdsrds
#    key-store-type: PKCS12
#    key-alias: rds-platform

  jetty:
    threads:
      min: 10
      max: 200
      idle-timeout: 60000

    accesslog:
      enabled: true
      filename: /opt/rds/log/access.log
      file-date-format: .yyyy-MM-dd
      retention-period: 30
      append: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rdsdb
    username: rds
    password: rds
#    password: strongpassword
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Upload-limieten (o.a. afbeeldingen in e-mailtemplates). De standaard van Spring is
  # 1MB; houd max-file-size gelijk aan app.email.image.max-bytes hieronder.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # SMTP voor het versturen van e-mails (Slice 3). Lokaal bewust leeg: zonder
  # 'host' valt de applicatie terug op een log-only mailer (niets wordt echt
  # verstuurd). Op test/productie via env-vars invullen (SPRING_MAIL_HOST enz.).
  # Uitleg per property:
#  mail:
#    # Hostnaam/IP van de SMTP-relay. ZODRA deze gezet is, verstuurt de app echt
#    # (SmtpEmailSender i.p.v. de log-only mailer). Leeg = niets wordt verstuurd.
#    host: smtp.example.com
#    # TCP-poort van de SMTP-server: 587 = STARTTLS (gangbaar), 465 = SMTPS/SSL,
#    # 25 = onversleuteld (meestal geblokkeerd/afgeraden).
#    port: 587
#    # Inlognaam bij de SMTP-relay (vaak het volledige e-mailadres of een API-user).
#    username: relay-user
#    # Wachtwoord/API-sleutel bij username. Op test/prod via env-var, niet hardcoden.
#    password: changeit
#    # Extra JavaMail-instellingen (worden 1-op-1 doorgegeven aan de mail-sessie):
#    properties:
#      # Authenticatie aanzetten: stuur username/password mee bij verbinden.
#      mail.smtp.auth: true
#      # Verbinding na connect upgraden naar TLS (hoort bij poort 587).
#      mail.smtp.starttls.enable: true
#      # Optioneel: time-outs (ms) zodat een trage relay de request niet laat hangen.
#      # mail.smtp.connectiontimeout: 5000
#      # mail.smtp.timeout: 5000
#      # mail.smtp.writetimeout: 5000

